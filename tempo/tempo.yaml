# Deliberately NOT the metrics_generator/remote_write setup shown in Tempo's
# own docker-compose examples (span-metrics/service-graphs derived FROM
# traces, written back to Prometheus). That bridge runs the opposite
# direction from this stack's own Bridge #2 (see
# expense-backend-v1.2/src/metrics.js): the backend already emits its own
# RED metrics directly via prom-client, with a real trace_id exemplar on
# every observation, so Tempo deriving a second, parallel set of the same
# metrics from spans would be redundant — one bridge, not two.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "tempo:4317"
        http:
          endpoint: "tempo:4318"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# No compactor: block, deliberately — Tempo 3.0 removed it as a standalone
# top-level config section (confirmed against grafana/tempo's own 2.x->3.0
# migration example: its single-binary config doesn't set one either).
# Setting it here is what crashed this container: "field compactor not found
# in type app.Config". Whatever Tempo 3.0's built-in default retention is
# applies instead — moot anyway, since no named volume backs /var/tempo (see
# docker-compose.yml), so this data doesn't survive a container recreation
# regardless of any retention setting.

usage_report:
  reporting_enabled: false
