global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'info@joindevops.com'
  smtp_auth_username: 'info@joindevops.com'
  # Real secrets never live in this file — see ./secrets/README.md.
  # Confirmed field names against Prometheus's own Alertmanager
  # configuration reference, not guessed: smtp_auth_password_file and
  # api_url_file (below) are both real, documented alternatives to putting
  # the secret inline as smtp_auth_password / api_url.
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp_password
  smtp_require_tls: true

route:
  receiver: 'email-and-slack'
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: 'email-and-slack'
    email_configs:
      - to: 'm.sivakmrreddy@gmail.com'
        send_resolved: true
    slack_configs:
      - channel: '#grafana-alerts-2'
        api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        send_resolved: true
    # RCA agent (../rca-agent): a plain HTTP webhook, not another Slack
    # destination — this is what feeds agent-spec.md's alert-detection
    # flow. Same receiver as the two above so a single alert triggers all
    # three (email, human Slack notice, and the agent's own investigation)
    # from one route. send_resolved is required here specifically: the
    # agent's incident lifecycle (rca-agent/app/state/store.py) needs the
    # resolved event to close out an incident, not just the firing one.
    webhook_configs:
      - url: 'http://rca-agent:8080/webhook/alertmanager'
        send_resolved: true
